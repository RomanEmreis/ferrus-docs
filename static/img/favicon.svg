<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="node" gradientUnits="userSpaceOnUse" x1="16" y1="11" x2="48" y2="53">
      <stop offset="0" stop-color="#e8861f"/>
      <stop offset="1" stop-color="#c4691e"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="16" y1="11" x2="48" y2="53">
      <stop offset="0" stop-color="#a85416"/>
      <stop offset="1" stop-color="#93481a"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="11" fill="#231f1e"/>

  <!-- an F drawn as a graph: three nodes on the spine, two branching right -->
  <g fill="url(#edge)">
    <rect x="21" y="14.5" width="23.2" height="2"/>
    <rect x="20" y="15.5" width="2" height="16"/>
    <rect x="21" y="30.5" width="18.7" height="2"/>
    <rect x="20" y="31.5" width="2" height="17.7"/>
  </g>

  <g fill="none" stroke="url(#node)">
    <circle cx="21" cy="15.5" r="3.175" stroke-width="2.85"/>
    <circle cx="44.2" cy="15.5" r="2.35" stroke-width="2.1"/>
    <circle cx="21" cy="31.5" r="2.8" stroke-width="2.6"/>
    <circle cx="39.7" cy="31.5" r="2.15" stroke-width="1.9"/>
    <circle cx="21" cy="49.2" r="2.675" stroke-width="2.45"/>
  </g>
</svg>
